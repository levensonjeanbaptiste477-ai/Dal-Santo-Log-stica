<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dal Santo Logística | Chapecó - SC</title>
<meta name="description" content="Dal Santo Logística — transporte rodoviário de cargas especiais, produtos perigosos, alimentos e cosméticos. Mais de 35 anos de tradição. Chapecó - SC.">
<style>
/* =========================================================
   1. RESET & VARIÁVEIS DE DESIGN EXCLUSIVO (VERMELHO E BRANCO CLEAN)
   ========================================================= */
:root {
  --vermelho-principal: #E30613;
  --vermelho-hover: #C5050F;
  --vermelho-suave: #FFF1F2;
  --branco-puro: #FFFFFF;
  --branco-gelo: #F8F9FA;
  --cinza-borda: #EBEBEB;
  --texto-escuro: #2D3142;
  --texto-suave: #6C757D;
  --font-display: 'Arial Black', sans-serif;
  --font-body: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --radius-lg: 16px;
  --radius-sm: 8px;
  --sombra-premium: 0 20px 40px rgba(227, 6, 19, 0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--texto-escuro); background: var(--branco-puro); line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* =========================================================
   2. HEADER PREMIUM
   ========================================================= */
header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--vermelho-principal); }
.nav-wrap { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
.brand { display: flex; align-items: center; gap: 14px; }

/* Logo Redondo Baseado na Seta Oficial */
.logo-circular {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--vermelho-principal);
  border: 2px solid var(--branco-puro);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(227, 6, 19, 0.2);
}
.emblema-d-oficial {
  background: var(--branco-puro);
  color: var(--vermelho-principal);
  width: 32px; height: 32px;
  border-radius: 6px 14px 14px 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 20px; font-weight: bold;
  padding-left: 2px;
}

.brand-name { font-family: var(--font-display); font-weight: 900; color: var(--texto-escuro); font-size: 22px; letter-spacing: -0.5px; line-height: 1.1; }
.brand-name small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--vermelho-principal); letter-spacing: .2em; text-transform: uppercase; margin-top: 1px; }

nav.main-nav ul { display: flex; gap: 32px; }
nav.main-nav a { color: var(--texto-suave); font-weight: 600; font-size: 14px; transition: .2s; }
nav.main-nav a:hover { color: var(--vermelho-principal); }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: var(--radius-sm); transition: .2s; text-transform: uppercase; }
.btn-primary { background: var(--vermelho-principal); color: var(--branco-puro); border: 2px solid var(--vermelho-principal); }
.btn-primary:hover { background: var(--vermelho-hover); border-color: var(--vermelho-hover); transform: translateY(-2px); }
.btn-outline { border: 2px solid var(--vermelho-principal); color: var(--vermelho-principal); background: transparent; }
.btn-outline:hover { background: var(--vermelho-suave); transform: translateY(-2px); }

/* =========================================================
   3. BANNER / HERO PREMIUM CONTRASTADO
   ========================================================= */
.hero { position: relative; padding: 80px 0; background: var(--branco-gelo); display: flex; align-items: center; overflow: hidden; min-height: 75vh; }
.hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: center; }
.hero-content { z-index: 2; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--vermelho-principal); font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 18px; }
.hero h1 { font-family: var(--font-display); color: var(--texto-escuro); font-size: clamp(32px, 4.5vw, 44px); line-height: 1.15; margin-bottom: 20px; }
.hero h1 em { font-style: normal; color: var(--vermelho-principal); }
.hero p { color: var(--texto-suave); font-size: 17px; margin-bottom: 34px; max-width: 540px; }
.hero-actions { display: flex; gap: 16px; flex-wrap: wrap; }

/* Composição Visual do Banner (Caminhão + Logo sobrepostos) */
.hero-media-composition { position: relative; display: flex; justify-content: center; align-items: center; width: 100%; }
.frame-caminhao { 
  width: 100%; max-width: 440px; background: var(--branco-puro); 
  border-radius: var(--radius-lg); padding: 16px; 
  box-shadow: var(--sombra-premium); border: 1px solid var(--cinza-borda);
}
.frame-caminhao img { width: 100%; border-radius: calc(var(--radius-lg) - 4px); object-fit: cover; }

/* Emblema Flutuante Redondo com o Logotipo Oficial */
.badge-logo-overlay {
  position: absolute; top: -20px; left: -20px;
  width: 130px; height: 130px; background: var(--branco-puro);
  border-radius: 50%; box-shadow: 0 12px 36px rgba(227, 6, 19, 0.15);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 4px solid var(--vermelho-principal); padding: 10px;
}
.badge-logo-overlay img { width: 85%; height: auto; object-fit: contain; }

/* =========================================================
   4. SEÇÕES REESTRUTURADAS (FUNDO CLARO)
   ========================================================= */
section { padding: 90px 0; }
.bg-suave { background: var(--branco-gelo); }
.section-head { max-width: 680px; margin-bottom: 50px; }
.section-eyebrow { color: var(--vermelho-principal); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; display: block; }
.section-head h2 { font-family: var(--font-display); color: var(--texto-escuro); font-size: clamp(26px, 3.2vw, 36px); line-height: 1.15; letter-spacing: -0.5px; }

/* Caixa Sobre com fundo claro e detalhes em vermelho */
.about-box-clean { background: var(--branco-puro); border: 1px solid var(--cinza-borda); border-top: 6px solid var(--vermelho-principal); border-radius: var(--radius-lg); padding: 50px; box-shadow: var(--sombra-premium); }
.about-box-clean p { color: var(--texto-suave); font-size: 16.5px; margin-bottom: 16px; }

/* Grid de Serviços Minimalista */
.services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; margin-top: 32px; }
.service-card-clean { background: var(--branco-puro); padding: 32px; border-radius: var(--radius-sm); border: 1px solid var(--cinza-borda); transition: 0.3s; }
.service-card-clean:hover { transform: translateY(-5px); border-color: var(--vermelho-principal); box-shadow: var(--sombra-premium); }
.service-card-clean h3 { font-family: var(--font-body); font-weight: 700; color: var(--texto-escuro); margin-bottom: 12px; font-size: 18px; }
.service-card-clean p { color: var(--texto-suave); font-size: 14.5px; }

/* =========================================================
   5. CONTATO E RODAPÉ CLEAN VERMELHO E BRANCO
   ========================================================= */
.footer-clean { background: var(--branco-puro); color: var(--texto-escuro); padding: 80px 0 30px 0; font-size: 14px; border-top: 4px solid var(--vermelho-principal); }
.footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; margin-bottom: 40px; }
.footer-col h4 { color: var(--vermelho-principal); font-size: 16px; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-display); }
.footer-col p { color: var(--texto-suave); margin-bottom: 10px; }
.footer-col a { color: var(--vermelho-principal); font-weight: bold; }
.footer-bottom { border-top: 1px solid var(--cinza-borda); padding-top: 30px; text-align: center; color: var(--texto-suave); font-size: 12px; }

@media (max-width: 992px) {
  .hero-grid { grid-template-columns: 1fr; gap: 60px; text-align: center; }
  .hero-content { max-width: 100%; }
  .hero-actions { justify-content: center; }
  .hero-media-composition { margin-top: 20px; }
  .badge-logo-overlay { top: -30px; left: 10px; width: 110px; height: 110px; }
  nav.main-nav { display: none; }
}
</style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="nav-wrap container">
      <div class="brand">
        <!-- Ícone Redondo com o caractere "D" e a Seta embutida -->
        <div class="logo-circular">
          <div class="emblema-d-oficial">➔</div>
        </div>

        </div>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="#inicio">Início</a></li>
          <li><a href="#sobre">Empresa</a></li>
          <li><a href="#servicos">Serviços</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </nav>
      <div class="nav-actions">

  <section id="inicio" class="hero">
    <div class="container hero-grid">
      <div class="hero-content">
        <span class="eyebrow">Soluções Rodoviárias</span>
        <h1>Conectando destinos com <em>segurança</em> e compromisso.</h1>
